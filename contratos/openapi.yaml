openapi: 3.1.0
info:
  title: SmartHome API
  description: Interpreta instrucciones escritas (léxico, sintáctico, semántico),
    las ejecuta sobre dispositivos simulados y guarda el historial.
  version: 3.0.0
paths:
  /api/health:
    get:
      tags:
      - Sistema
      summary: Salud
      operationId: salud_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/state:
    get:
      tags:
      - Estado
      summary: Estado
      operationId: estado_api_state_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estado'
  /api/devices:
    get:
      tags:
      - Dispositivos
      summary: Dispositivos
      operationId: dispositivos_api_devices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Dispositivo'
                type: array
                title: Response Dispositivos Api Devices Get
    post:
      tags:
      - Dispositivos
      summary: Registra un dispositivo nuevo
      operationId: crear_dispositivo_api_devices_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispositivoEntrada'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estado'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
  /api/devices/{dispositivo_id}:
    get:
      tags:
      - Dispositivos
      summary: Dispositivo
      operationId: dispositivo_api_devices__dispositivo_id__get
      parameters:
      - name: dispositivo_id
        in: path
        required: true
        schema:
          type: string
          title: Dispositivo Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispositivo'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Dispositivos
      summary: Ejecuta una acción sobre un dispositivo
      operationId: accion_dispositivo_api_devices__dispositivo_id__patch
      parameters:
      - name: dispositivo_id
        in: path
        required: true
        schema:
          type: string
          title: Dispositivo Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccionDispositivo'
      responses:
        '200':
          description: Instrucción ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaComando'
        '422':
          description: Error léxico, sintáctico, semántico o de ejecución
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaComando'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
    put:
      tags:
      - Dispositivos
      summary: Edita un dispositivo existente
      operationId: editar_dispositivo_api_devices__dispositivo_id__put
      parameters:
      - name: dispositivo_id
        in: path
        required: true
        schema:
          type: string
          title: Dispositivo Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispositivoEntrada'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estado'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
          description: Unprocessable Entity
    delete:
      tags:
      - Dispositivos
      summary: Elimina un dispositivo
      operationId: eliminar_dispositivo_api_devices__dispositivo_id__delete
      parameters:
      - name: dispositivo_id
        in: path
        required: true
        schema:
          type: string
          title: Dispositivo Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estado'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/command:
    post:
      tags:
      - Instrucciones
      summary: Analiza y ejecuta una instrucción
      operationId: ejecutar_comando_api_command_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comando'
        required: true
      responses:
        '200':
          description: Instrucción ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaComando'
        '422':
          description: Error léxico, sintáctico, semántico o de ejecución
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaComando'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
  /api/analyze:
    post:
      tags:
      - Instrucciones
      summary: Analiza una instrucción sin ejecutarla
      operationId: analizar_api_analyze_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comando'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analisis'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analisis'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
  /api/temperature:
    get:
      tags:
      - Sensor
      summary: Leer Temp
      operationId: leer_temp_api_temperature_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Temperatura'
    put:
      tags:
      - Sensor
      summary: Fijar Temperatura
      operationId: fijar_temperatura_api_temperature_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Temperatura'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estado'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/history:
    get:
      tags:
      - Historial
      summary: Historial
      operationId: historial_api_history_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Registro'
                title: Response Historial Api History Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AccionDispositivo:
      properties:
        action:
          type: string
          enum:
          - ENCENDER
          - APAGAR
          - ABRIR
          - CERRAR
          - ACTIVAR
          - DESACTIVAR
          title: Action
      type: object
      required:
      - action
      title: AccionDispositivo
    Analisis:
      properties:
        ok:
          type: boolean
          title: Ok
        ast:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Ast
        ir:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Ir
        ir_tac:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Ir Tac
          description: IR en código de tres direcciones
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorLenguajeModelo'
          - type: 'null'
      type: object
      required:
      - ok
      title: Analisis
    Comando:
      properties:
        command:
          type: string
          maxLength: 300
          minLength: 1
          title: Command
          examples:
          - ENCENDER luz_sala
      type: object
      required:
      - command
      title: Comando
    Dispositivo:
      properties:
        id:
          type: string
          title: Id
          examples:
          - luz_sala
        name:
          type: string
          title: Name
          examples:
          - Luz de sala
        type:
          type: string
          enum:
          - luz
          - ventilador
          - puerta
          - alarma
          title: Type
        estado:
          type: string
          title: Estado
          examples:
          - APAGADO
        'on':
          anyOf:
          - type: boolean
          - type: 'null'
          title: 'On'
        open:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Open
      type: object
      required:
      - id
      - name
      - type
      - estado
      title: Dispositivo
    DispositivoEntrada:
      properties:
        id:
          type: string
          maxLength: 40
          minLength: 1
          title: Id
          examples:
          - luz_pasillo
        name:
          type: string
          maxLength: 60
          minLength: 1
          title: Name
          examples:
          - Luz del pasillo
        type:
          type: string
          enum:
          - luz
          - ventilador
          - puerta
          - alarma
          title: Type
      type: object
      required:
      - id
      - name
      - type
      title: DispositivoEntrada
    ErrorLenguajeModelo:
      properties:
        tipo:
          type: string
          title: Tipo
        mensaje:
          type: string
          title: Mensaje
        linea:
          type: integer
          title: Linea
        columna:
          type: integer
          title: Columna
      type: object
      required:
      - tipo
      - mensaje
      - linea
      - columna
      title: ErrorLenguajeModelo
    ErrorSimple:
      properties:
        error:
          type: string
          title: Error
      type: object
      required:
      - error
      title: ErrorSimple
    Estado:
      properties:
        devices:
          items:
            $ref: '#/components/schemas/Dispositivo'
          type: array
          title: Devices
        temperature:
          type: number
          title: Temperature
        history:
          items:
            $ref: '#/components/schemas/Registro'
          type: array
          title: History
      type: object
      required:
      - devices
      - temperature
      - history
      title: Estado
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        version:
          type: string
          title: Version
      type: object
      required:
      - version
      title: Health
    Registro:
      properties:
        id:
          type: integer
          title: Id
        timestamp:
          type: string
          title: Timestamp
        command:
          type: string
          title: Command
        message:
          type: string
          title: Message
        success:
          type: boolean
          title: Success
        skipped:
          type: boolean
          title: Skipped
      type: object
      required:
      - id
      - timestamp
      - command
      - message
      - success
      - skipped
      title: Registro
    RespuestaComando:
      properties:
        result:
          $ref: '#/components/schemas/Registro'
        analysis:
          $ref: '#/components/schemas/Analisis'
        devices:
          items:
            $ref: '#/components/schemas/Dispositivo'
          type: array
          title: Devices
        temperature:
          type: number
          title: Temperature
        history:
          items:
            $ref: '#/components/schemas/Registro'
          type: array
          title: History
      type: object
      required:
      - result
      - analysis
      - devices
      - temperature
      - history
      title: RespuestaComando
    Temperatura:
      properties:
        temperature:
          type: number
          maximum: 60.0
          minimum: -20.0
          title: Temperature
          examples:
          - 30
      type: object
      required:
      - temperature
      title: Temperatura
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
